<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pieces of me | Peace Writes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d0c0d;
      color: #eee8e8;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.8;
    }

    .page {
      max-width: 900px;
      margin: auto;
      padding: 60px 8%;
    }

    .back {
      color: #aaa1a5;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .back:hover {
      color: white;
    }

    .book {
      margin-top: 70px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 55px;
      align-items: center;
    }

    .cover {
      height: 390px;
      background: linear-gradient(145deg, #261b20, #0b0a0b);
      border: 1px solid #3b3035;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .cover-inner {
      border: 1px solid #67555d;
      width: 100%;
      height: 100%;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cover small {
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 3px;
      color: #a99ca1;
    }

    .cover h2 {
      font-size: 28px;
      font-weight: normal;
      line-height: 1.2;
    }

    .details h1 {
      font-size: 45px;
      font-weight: normal;
      line-height: 1.1;
      margin-top: 0;
    }

    .details p {
      color: #aaa1a5;
      font-size: 18px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      margin-right: 8px;
      padding: 12px 22px;
      border: 1px solid #71666b;
      color: #eee8e8;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .button:hover {
      background: #eee8e8;
      color: #0d0c0d;
    }

    @media (max-width: 650px) {
      .book {
        grid-template-columns: 1fr;
      }

      .cover {
        width: 280px;
      }

      .details h1 {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <a href="../index.html" class="back">
      ← Back to Peace Writes
    </a>

    <div class="book">

      <div class="cover">

  <img src="../images/3fd34e06-1b55-433c-80fd-f05dc44ab412.jpeg"
       alt="Pieces of Me book cover"
       style="width:100%; height:100%; object-fit:cover;">

</div>
<div class="details">

  <h1>PIECES OF ME</h1>
    

    <p>
      Broken fragments. Unspoken thoughts. Pieces of me.
   <p>

     <a href="contents.html" class="button">
         Read
     </a>

        <a href="#" class="button">
          Buy
        </a>
      </div>

    </div>

  </div>

</body>
</html>
